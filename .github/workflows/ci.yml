name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Test, typecheck, build, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reject high and critical dependency advisories
        run: npm audit --audit-level=high

      - name: Check independent app dependencies
        run: npm audit --prefix shopify-app --audit-level=high

      - name: Run tests
        run: npm test

      - name: Test independent Shopify rotation app
        run: npm test --prefix shopify-app

      - name: Run typecheck
        run: npm run typecheck

      - name: Build production bundle
        run: npm run build

      - name: Keep local checkout inspection tools out of production
        run: npm run check:production-boundary

      - name: Run lint
        run: npm run lint

      - name: Check PHP syntax and private rotation safety fixtures
        run: |
          find wordpress -name '*.php' -print0 | xargs -0 -n1 php -l
          php wordpress/tests/run.php
